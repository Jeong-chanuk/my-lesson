<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 관리자 통합 모드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #339af0;
            --green: #28a745;
            --red: #ff6b6b;
            --gray: #f8f9fa;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--gray);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h2,
        h3 {
            color: var(--blue);
            margin-top: 0;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 시간표 그리드 */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .time-btn {
            padding: 10px;
            background: #eee;
            color: #333;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }

        .time-btn.active {
            background: var(--blue);
            color: white;
        }

        /* 학생 관리 테이블 */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .admin-table th {
            background: #f1f3f5;
            padding: 10px;
            font-size: 13px;
            border-bottom: 2px solid #dee2e6;
        }

        .admin-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        /* 월간 달력 */
        #calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #dee2e6;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .cal-header {
            background: #f8f9fa;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
        }

        .cal-day {
            background: white;
            min-height: 80px;
            padding: 5px;
            font-size: 11px;
            box-sizing: border-box;
            position: relative;
        }

        .res-item {
            background: #e7f5ff;
            color: #0056b3;
            padding: 2px;
            margin-top: 2px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <div class="admin-card">
        <h2>📅 수업 시간표 개설</h2>
        <div class="input-group">
            <label>날짜 선택</label>
            <input type="date" id="lesson-date" onchange="fetchDaySchedules()">
        </div>
        <div id="time-grid" class="time-grid"></div>
    </div>

    <div class="admin-card">
        <h3>🗓️ 전체 예약 현황</h3>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button onclick="moveMonth(-1)" style="width:auto; padding:5px 15px;">◀</button>
            <span id="current-month-label" style="font-weight:bold; font-size:18px;"></span>
            <button onclick="moveMonth(1)" style="width:auto; padding:5px 15px;">▶</button>
        </div>
        <div id="calendar-grid"></div>
    </div>

    <div class="admin-card">
        <h3>👥 학생 등록 및 관리</h3>
        <div id="student-list-container">로딩 중...</div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <h4>➕ 새 학생 추가</h4>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="new-name" placeholder="학생 이름">
            <button onclick="addNewStudent()" style="width: 100px; background: var(--green);">등록</button>
        </div>
    </div>

    <div id="student-list-container"></div>

    <hr style="margin: 30px 0;">

    <div class="inactive-section" style="background: #f9f9f9; padding: 15px; border-radius: 8px;">
        <h3>퇴소생 및 휴원생 관리</h3>
        <div id="inactive-list-container">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://stjmbuhxmdnogmzmeqmt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GJe263qFZFStFSXh2oT3AA_D2wUEqmD';
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

        let viewDate = new Date();

        window.onload = () => {
            initTimeGrid();
            refreshDashboard();
        };

        // --- 1. 시간표 관리 ---
        function initTimeGrid() {
            const grid = document.getElementById('time-grid');
            const times = ["14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"];
            grid.innerHTML = times.map(t => `<div class="time-btn" id="time-${t.replace(':', '')}" onclick="toggleSchedule('${t}')">${t}</div>`).join('');
        }

        async function fetchDaySchedules() {
            const date = document.getElementById('lesson-date').value;
            if (!date) return;
            // ClassSchedules 또는 Schedules 등 사용하시는 테이블명에 맞춰 수정 필요 (현재 이미지엔 ClassSchedules 보임)
            const res = await fetch(`${SUPABASE_URL}/rest/v1/ClassSchedules?lesson_date=eq.${date}`, { headers });
            const data = await res.json();
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (Array.isArray(data)) {
                data.forEach(s => {
                    const id = `time-${s.lesson_time.replace(':', '')}`;
                    if (document.getElementById(id)) document.getElementById(id).classList.add('active');
                });
            }
        }

        async function toggleSchedule(time) {
            const date = document.getElementById('lesson-date').value;
            if (!date) return alert("날짜를 먼저 선택하세요.");
            const btn = document.getElementById(`time-${time.replace(':', '')}`);
            const isActive = btn.classList.contains('active');

            if (!isActive) {
                await fetch(`${SUPABASE_URL}/rest/v1/ClassSchedules`, {
                    method: 'POST', headers, body: JSON.stringify({ lesson_date: date, lesson_time: time })
                });
            } else {
                await fetch(`${SUPABASE_URL}/rest/v1/ClassSchedules?lesson_date=eq.${date}&lesson_time=eq.${time}`, { method: 'DELETE', headers });
            }
            fetchDaySchedules();
        }

        async function refreshDashboard() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth() + 1;
            const monthKey = `${year}-${String(month).padStart(2, '0')}`;
            document.getElementById('current-month-label').innerText = `${year}년 ${month}월`;
            // --- 2. 대시보드 (달력 + 학생목록) ---
            try {
                const [allStdRes, slotRes, resRes, activeStdRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/Students?select=id,Name`, { headers }),
                    fetch(`${SUPABASE_URL}/rest/v1/StudentMonthlySlots?month_key=eq.${monthKey}`, { headers }),
                    fetch(`${SUPABASE_URL}/rest/v1/Reservations?lesson_date=gte.${monthKey}-01&lesson_date=lte.${monthKey}-31`, { headers }), // 쉼표 추가 필수!
                    fetch(`${SUPABASE_URL}/rest/v1/Students?is_active=eq.true&select=id,Name`, { headers })
                ]);

                // 각각의 결과를 JSON으로 변환
                const allStudents = await allStdRes.json();     // 전체 학생
                const monthlySlots = await slotRes.json();     // 배정 횟수 데이터
                const reservations = await resRes.json();     // 예약 데이터
                const activeStudents = await activeStdRes.json(); // 활성 학생만

                // 화면에는 활성 학생(activeStudents)만 그려줍니다.
                renderStudentTable(activeStudents, monthlySlots, reservations);
                renderInactiveList(allStudents.filter(s => !s.is_active));
                renderCalendar(reservations, activeStudents);
            } catch (e) {
                console.error("데이터 갱신 중 오류:", e);
            }

            function renderStudentTable(students, monthlySlots, reservations) {
                let html = `
        <table class="admin-table">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>이번 달 배정</th>
                    <th>사용/잔여</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>`;

                students.forEach(s => {
                    // total_slots -> allowed_slots 로 수정
                    const slotData = monthlySlots.find(m => m.student_id === s.id);
                    const assigned = slotData ? slotData.allowed_slots : 0;

                    // 예약 데이터에서 학생 ID와 일치하는 개수 계산
                    const used = reservations.filter(r => Number(r.student_id) === s.id).length;
                    const remaining = assigned - used;

                    html += `
            <tr>
                <td><strong>${s.Name}</strong></td>
                <td>
                    <input type="number" value="${assigned}" 
                           onchange="updateTotalSlots(${s.id}, this.value)" 
                           style="width:45px; text-align:center;"> 회
                </td>
                <td>
                    <span style="color:#0056b3; font-weight:bold;">${used}</span> / 
                    <span style="color:${remaining < 0 ? 'red' : 'black'}">${remaining}</span>
                </td>
                <td>
                    <button onclick="updateStudentStatus(${s.id}, false)" style="background:orange; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">퇴소</button>
                </td>
            </tr>`;
                });
                document.getElementById('student-list-container').innerHTML = html + `</tbody></table>`;
            }

            async function addNewStudent() {
                const name = document.getElementById('new-name').value;
                if (!name) return;
                // total_slots를 코드에서 완전히 제거하여 400 에러 방지
                const res = await fetch(`${SUPABASE_URL}/rest/v1/Students`, {
                    method: 'POST', headers: { ...headers, 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ Name: name })
                });
                if (res.ok) { document.getElementById('new-name').value = ''; refreshDashboard(); }
            }

            function renderCalendar(reservations, students) {
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = '';

                // 요일 헤더
                ['일', '월', '화', '수', '목', '금', '토'].forEach(d => {
                    grid.innerHTML += `<div class="cal-header">${d}</div>`;
                });

                const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay();
                const lastDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="cal-day"></div>`;

                // 학생 데이터가 없을 경우를 대비한 안전장치
                const safeStudents = Array.isArray(students) ? students : [];

                for (let d = 1; d <= lastDate; d++) {
                    const dateStr = `${viewDate.getFullYear()}-${String(viewDate.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const dayRes = Array.isArray(reservations) ? reservations.filter(r => r.lesson_date === dateStr) : [];

                    // resHtml 변수 중복 에러 방지
                    const calendarItemHtml = dayRes.map(r => {
                        // ID로 이름 찾기
                        const student = safeStudents.find(s => s.id === Number(r.student_id));
                        const nameToShow = student ? student.Name : r.student_id;

                        return `<div class="res-item" onclick="deleteRes('${r.id}')">
                        ${r.lesson_time} ${nameToShow}
                    </div>`;
                    }).join('');

                    grid.innerHTML += `<div class="cal-day"><strong>${d}</strong>${calendarItemHtml}</div>`;
                }
            }
            async function deleteRes(id) {
                if (!confirm("예약을 삭제할까요?")) return;
                await fetch(`${SUPABASE_URL}/rest/v1/Reservations?id=eq.${id}`, { method: 'DELETE', headers });
                refreshDashboard();
            }

            // 이름을 버튼이 부르는 'updateStudentStatus'로 바꿉니다.
            async function updateStudentStatus(id, status) {
                // status가 false로 들어오면 퇴소 처리를 진행합니다.
                const msg = status ? "복구하시겠습니까?" : "이 학생을 '퇴소' 처리하시겠습니까? 기록은 보존되며 목록에서만 숨겨집니다.";
                if (!confirm(msg)) return;

                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/Students?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: headers,
                        body: JSON.stringify({ is_active: status }) // 매개변수로 받은 status(false) 적용
                    });

                    if (res.ok) {
                        alert(status ? "복구되었습니다." : "퇴소 처리가 완료되었습니다.");
                        refreshDashboard();
                    }
                } catch (e) {
                    console.error("처리 중 오류:", e);
                }
            }

            function moveMonth(offset) {
                viewDate.setMonth(viewDate.getMonth() + offset);
                refreshDashboard();
            }

            async function updateTotalSlots(studentId, newCount) {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth() + 1;
                const monthKey = `${year}-${String(month).padStart(2, '0')}`;

                // 1. 먼저 해당 데이터가 있는지 확인 (조회)
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/StudentMonthlySlots?student_id=eq.${studentId}&month_key=eq.${monthKey}`, {
                    headers: headers
                });
                const existingData = await checkRes.json();

                let res;
                if (existingData && existingData.length > 0) {
                    // 2. 데이터가 이미 있다면? -> PATCH (수정) 요청을 보냄
                    res = await fetch(`${SUPABASE_URL}/rest/v1/StudentMonthlySlots?student_id=eq.${studentId}&month_key=eq.${monthKey}`, {
                        method: 'PATCH',
                        headers: headers,
                        body: JSON.stringify({
                            allowed_slots: parseInt(newCount)
                        })
                    });
                } else {
                    // 3. 데이터가 없다면? -> POST (새로 추가) 요청을 보냄
                    res = await fetch(`${SUPABASE_URL}/rest/v1/StudentMonthlySlots`, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            student_id: studentId,
                            month_key: monthKey,
                            allowed_slots: parseInt(newCount)
                        })
                    });
                }

                if (res.ok) {
                    console.log("횟수 업데이트 성공");
                    refreshDashboard(); // 화면 수치 갱신
                } else {
                    const err = await res.json();
                    console.error("저장 실패:", err);
                }
            }
            // 비활성 학생 목록 그리기
            function renderInactiveList(inactiveStudents) {
                const container = document.getElementById('inactive-list-container');
                if (inactiveStudents.length === 0) {
                    container.innerHTML = "<p style='color:gray;'>퇴소 처리된 학생이 없습니다.</p>";
                    return;
                }

                let html = `<ul style="list-style:none; padding:0;">`;
                inactiveStudents.forEach(s => {
                    html += `
            <li style="margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; background:white; padding:8px; border-radius:4px; border:1px solid #ddd;">
                <span><strong>${s.Name}</strong> (퇴소 상태)</span>
                <button onclick="updateStudentStatus(${s.id}, true)" style="background:#28a745; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">복구하기</button>
            </li>`;
                });
                container.innerHTML = html + `</ul>`;
            }

            // 상태 변경 공통 함수 (복구/퇴소 겸용)
            // 학생의 활성화 상태(is_active)를 업데이트하는 함수
            async function updateStudentStatus(studentId, newStatus) {
                const confirmMsg = newStatus
                    ? "이 학생을 다시 복구하시겠습니까?"
                    : "이 학생을 퇴소 처리하시겠습니까? (기록은 보존됩니다)";

                if (!confirm(confirmMsg)) return;

                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/Students?id=eq.${studentId}`, {
                        method: 'PATCH', // 데이터를 수정할 때는 PATCH를 사용합니다.
                        headers: headers,
                        body: JSON.stringify({
                            is_active: newStatus // true면 복구, false면 퇴소
                        })
                    });

                    if (res.ok) {
                        alert(newStatus ? "복구되었습니다." : "퇴소 처리되었습니다.");
                        refreshDashboard(); // 화면 갱신
                    } else {
                        const err = await res.json();
                        console.error("상태 변경 실패:", err);
                    }
                } catch (e) {
                    console.error("네트워크 오류:", e);
                }
            }
        }
    </script>
</body>

</html>
